[package]
name = "babel-desktop"
version = "0.1.0"
description = "Babel Tower offline translation workbench"
authors = ["Babel Tower contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "babel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
babel-application = { path = "../../../crates/babel-application" }
babel-domain = { path = "../../../crates/babel-domain" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep desktop system dependencies outside the core workspace quality gate.
[workspace]
resolver = "2"
