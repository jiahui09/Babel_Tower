[workspace]
resolver = "2"
members = [
  "crates/babel-domain",
  "crates/babel-resource-graph",
  "crates/babel-tir",
  "crates/babel-adapter-protocol",
  "crates/babel-adapter-host",
  "crates/babel-txt-adapter",
  "crates/babel-markdown-adapter",
  "crates/babel-application",
  "crates/babel-storage",
  "crates/babel-runtime",
  "tools/phase0-runner",
  "tools/phase3-runner",
  "tools/phase4-runner",
  "tools/txt-worker",
  "tools/markdown-worker",
]
exclude = ["phase0"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
comrak = { version = "0.54.0", default-features = false }
encoding_rs = "0.8.35"
hex = "0.4.3"
hdrhistogram = "7.6.0"
interprocess = "2.4.3"
prost = "0.14.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "modern_sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
